# ============================================
# BareZen OA — 开发环境配置
# ============================================
# 此文件中的配置会覆盖 application.yml 中的同名配置。
# 默认激活（见 application.yml 中 spring.profiles.active=dev）。

# ---- 日志级别 ----
logging:
  level:
    root: INFO
    com.linan: DEBUG                        # 项目代码 DEBUG 级日志

# ---- MyBatis-Plus SQL 日志 ----
# 将 SQL 打印到标准输出，方便开发调试。
# 注意：生产环境禁止使用此配置，会泄露数据库结构与数据。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---- Flyway 配置（开发环境） ----
# 开发环境自动修复 Flyway 元数据（当检测到上次迁移失败时自动执行 repair）
# 生产环境需手动 flyway repair
spring:
  flyway:
    repair-on-migrate: true

  # ---- 数据源（本地开发默认密码） ----
  # 本地 Docker 数据库（zen-mysql），dev 环境关闭 SSL（本地开发无需证书），
  # 并开放公钥检索以适配 MySQL 8.0 认证插件。
  # 公共配置（application.yml）默认 useSSL=true，安全优先。
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:barezen_oa}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    password: ${DB_PASSWORD:123456}

# ---- JWT 开发环境默认密钥 ----
# 仅用于本地开发，避免每次启动都要手动设置 JWT_SECRET 环境变量。
# 注意：
#   1. 此密钥仅 dev profile 生效，生产环境（application-prod.yml）不设置默认值，
#      生产启动仍会因缺少 JWT_SECRET 而 fail-fast，符合安全规范。
#   2. 此密钥不在 JwtUtil 的 KNOWN_WEAK_SECRETS 黑名单中，可通过启动校验。
#   3. 生产部署前请务必通过 openssl rand -base64 32 生成随机密钥并注入 JWT_SECRET。
jwt:
  secret: dev-only-DO-NOT-USE-IN-PROD-replace-with-openssl-rand-base64-32