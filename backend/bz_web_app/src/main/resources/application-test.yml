# ============================================
# BareZen Base 测试环境配置
# ============================================

spring:
  application:
    name: BareZen-Base-Test

  # ---- 测试数据源配置 ----
  # 使用H2内存数据库进行测试，避免依赖外部MySQL
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # ---- SQL 自动初始化 ----
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # ---- Flyway 配置（测试环境禁用，使用SQL初始化）----
  flyway:
    enabled: false

  # ---- Redis 配置（测试环境使用嵌入式Redis或禁用）----
  data:
    redis:
      host: localhost
      port: 6379
      database: 1  # 使用独立的测试数据库
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 2
          max-idle: 2
          min-idle: 0

  # ---- 测试环境专用配置 ----
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# ---- JWT 配置（测试环境使用固定密钥）----
jwt:
  secret: test-secret-key-for-testing-purposes-only-32chars
  expiration: 3600000  # 测试环境1小时过期

# ---- 认证扩展 ----
auth:
  register-enabled: true  # 测试环境启用注册功能

# ---- 安全配置（测试环境信任代理头）----
security:
  trust-proxy-headers: true

# ---- CORS配置（测试环境允许所有来源）----
cors:
  allowed-origins: "*"

# ---- 日志配置（测试环境详细日志）----
logging:
  level:
    root: INFO
    com.linan: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# ---- MyBatis-Plus 配置（测试环境显示SQL）----
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---- 测试专用配置 ----
barezen:
  upload-path: ./uploads-test
  instance-id: test-instance-1
  storage:
    type: local