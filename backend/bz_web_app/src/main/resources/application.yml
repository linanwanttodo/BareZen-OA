# ============================================
# BareZen Base 应用配置
# ============================================

# ---- 服务端口与上下文 ----
server:
  # 默认 8080；端口被占用时可通过环境变量 SERVER_PORT 或 --server.port 覆盖，无需改代码
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2048
  # servlet.context-path: /api  # 如果需要统一前缀可取消注释

# ---- Spring 核心配置 ----
spring:
  application:
    name: BareZen-Base  # 应用名称，用于 Spring Cloud 等服务治理

  # ---- 虚拟线程（Java 21） ----
  threads:
    virtual:
      enabled: true     # 启用虚拟线程，提升 I/O 密集型任务吞吐量

  # ---- Redis 配置 ----
  # Spring Boot 3.x 中 Redis 配置前缀为 spring.data.redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ---- SQL 自动初始化 ----
  # 已迁移到 Flyway 管理，参见 db/migration/ 目录
  sql:
    init:
      mode: never

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
    out-of-order: false

  # ---- 数据源配置 ----
  # MySQL 8.0 数据库连接（连接 Docker 中启动的 zen-mysql 容器）
  # 生产请通过环境变量覆盖：DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:barezen_base}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    # 密码不设公共默认值（弱默认值已移除）：本地开发默认密码在 application-dev.yml，
    # 生产环境（application-prod.yml）同样无默认——缺失 DB_PASSWORD 时启动直接失败（fail-fast），
    # 杜绝「带着弱口令上生产」的可能。
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（Spring Boot 默认连接池）
    hikari:
      minimum-idle: 5               # 最小空闲连接数
      maximum-pool-size: 20         # 最大连接数
      connection-timeout: 30000     # 连接超时时间（毫秒）
      idle-timeout: 600000          # 空闲连接超时（10分钟）
      max-lifetime: 1800000         # 连接最大存活时间（30分钟）

  # ---- 文件上传配置 ----
  # 默认 1MB，与 SysFileServiceImpl.MAX_FILE_SIZE（100MB）对齐
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ---- Jackson JSON 序列化配置 ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss     # 全局日期格式
    time-zone: Asia/Shanghai              # 时区
    serialization:
      write-dates-as-timestamps: false    # 不使用时间戳格式输出日期
    # default-property-inclusion: non_null  # 忽略 null 字段（使响应更简洁，按需开启）

  # ---- 配置文件选择 ----
  # 多环境配置通过 spring.profiles.active 切换
  # 默认激活 dev 环境，生产环境启动时加 --spring.profiles.active=prod
  # 配置文件：
  #   application.yml         —— 公共配置（所有环境共享）
  #   application-dev.yml     —— 开发环境（SQL 日志、DEBUG 级别）
  #   application-prod.yml    —— 生产环境（SQL 日志关闭、INFO 级别、连接池优化）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# ---- 自定义应用配置 ----
barezen:
  upload-path: ${BAREZEN_UPLOAD_PATH:./uploads}  # 本地存储根路径（barezen.storage.type=local 时生效），可通过环境变量覆盖
  storage:
    type: ${BAREZEN_STORAGE_TYPE:local}  # 文件存储实现：local=本地磁盘（默认）/ s3=S3 兼容对象存储（MinIO/OSS/COS）
    s3:
      endpoint: ${BAREZEN_S3_ENDPOINT:}       # S3 兼容端点，如 http://minio:9000
      bucket: ${BAREZEN_S3_BUCKET:}           # 存储桶名（type=s3 时必填）
      region: ${BAREZEN_S3_REGION:us-east-1}
      access-key: ${BAREZEN_S3_ACCESS_KEY:}
      secret-key: ${BAREZEN_S3_SECRET_KEY:}
      path-style: ${BAREZEN_S3_PATH_STYLE:true}  # MinIO/COS 需 true，阿里云 OSS 虚拟主机模式可设 false

# ---- MyBatis-Plus 配置 ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.linan.system.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: SQL 日志请在对应环境配置文件中设置（dev 用 StdOutImpl，prod 用 Slf4jImpl）

# ---- JWT 配置 ----
# 安全要求：
#   1. 密钥长度必须 >= 32 字符（HMAC-SHA256 需要 256 位密钥）
#   2. 生产环境务必通过 JWT_SECRET 环境变量设置密钥
#   3. 开发环境可通过 application-dev.yml 或 IDE 环境变量设置 JWT_SECRET
#   4. 可使用如下命令生成安全密钥：
#      openssl rand -base64 32
#   5. JwtUtil 启动时会自动校验密钥强度，弱密钥会阻止应用启动
# 注意：默认密钥已被移除，必须通过环境变量 JWT_SECRET 提供
jwt:
  secret: ${JWT_SECRET:}  # 必须通过环境变量设置，不能使用默认值
  expiration: ${JWT_EXPIRATION:86400000}    # Token 过期时间（毫秒），24 小时

# ---- 认证扩展 ----
auth:
  register-enabled: ${AUTH_REGISTER_ENABLED:false}

# ---- 安全 ----
# 是否信任反向代理透传的客户端 IP 头（X-Forwarded-For / X-Real-IP）。
#   默认 false：只取 socket 直连地址（getRemoteAddr），防客户端伪造 IP 绕过限流/误伤他人；
#   仅当部署了可控的 Nginx 等反向代理并已配置覆盖这两个头时改为 true，
#   否则客户端可伪造该头（IpUtil 限流/防重/操作日志/登录日志统一使用）。
security:
  trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}

# ---- CORS（生产配置具体域名，逗号分隔；空=开发放行）----
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ---- 日志配置 ----
logging:
  level:
    root: INFO                          # 根日志级别
    com.linan: DEBUG                    # 项目包日志级别（开发环境使用 DEBUG）
    org.springframework: WARN           # Spring 框架日志级别
    # org.springframework.jdbc: DEBUG   # 如需查看 SQL 日志可取消注释
  # pattern:
  #   console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"