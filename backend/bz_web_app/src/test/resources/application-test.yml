# ============================================
# BareZen Base 测试环境配置
# ============================================
# 说明：集成测试使用真实 MySQL（本机 3306）+ 独立测试库 barezen_test，
#       由 Flyway V1-V47 自动建表（GenTableQueryServiceImpl 依赖 MySQL
#       information_schema 方言，H2 无法兼容）；Redis 使用本机 6379（database 1）。
# createDatabaseIfNotExist=true：库不存在时自动创建（需要 MySQL 账号有建库权限，root 满足）。

spring:
  application:
    name: BareZen-Base-Test

  # ---- 测试数据源（真实 MySQL，独立测试库） ----
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:barezen_test}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # ---- SQL 自动初始化（真实库由 Flyway 管理，禁用脚本初始化） ----
  sql:
    init:
      mode: never

  # ---- Flyway 配置（测试库全量迁移建表） ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history

  # ---- Redis 配置（本机 Redis，独立测试库 1） ----
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 2
          max-idle: 2
          min-idle: 0

# ---- JWT 配置（测试环境使用固定密钥） ----
jwt:
  secret: test-secret-key-for-testing-purposes-only-32chars
  expiration: 3600000  # 测试环境1小时过期

# ---- 认证扩展 ----
auth:
  register-enabled: true  # 测试环境启用注册功能

# ---- 安全配置（测试环境信任代理头） ----
security:
  trust-proxy-headers: true

# ---- CORS配置（测试环境允许所有来源） ----
cors:
  allowed-origins: "*"

# ---- 日志配置（测试环境详细日志） ----
logging:
  level:
    root: INFO
    com.linan: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

# ---- MyBatis-Plus 配置（测试环境显示SQL） ----
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---- 测试专用配置 ----
barezen:
  upload-path: ./uploads-test
  instance-id: test-instance-1
  storage:
    type: local
