<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- BareZen Logo - 简洁现代风格 -->
  <!-- 图标：抽象的"B"与"Z"融合，代表极简与平衡 -->
  <rect x="0" y="4" width="32" height="32" rx="8" fill="#3370FF"/>
  <path d="M8 12h8c4 0 7 2.5 7 6s-3 6-7 6H8V12z" fill="white"/>
  <path d="M8 24h9c4 0 7-2.5 7-6" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 文字：BareZen -->
  <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">Bare</text>
  <text x="92" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="300" fill="#666">Zen</text>
</svg>
